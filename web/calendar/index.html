<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Calendar — HRTD</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;family=Source+Serif+4:wght@600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/hrtd.css">
<script src="/assets/hrtd.js"></script>
</head>
<body>
<div id="hdr"></div>
<main class="wrap">
  <h1 class="pg">Release calendar</h1>
  <p class="muted">Every U.S. release day in HRTD, each with the dated record it comes from.</p>
  <div class="pager"><label for="yr">Year</label><select id="yr" class="filter" style="max-width:140px"></select><input class="filter" id="f" placeholder="Filter by release or agency" aria-label="Filter"></div>
  <div id="out"><div class="loading">Loading…</div></div>
</main>
<div id="ftr"></div>
<script>
(async () => {
  const idx = await H.idx(), sel = document.getElementById('yr'), out = document.getElementById('out'), f = document.getElementById('f');
  const years = idx.years.map(y => y[0]).sort().reverse();
  sel.innerHTML = years.map(y => `<option>${y}</option>`).join('');
  const want = H.qs('y'); if (want && years.includes(want)) sel.value = want;
  const show = async () => {
    out.innerHTML = '<div class="loading">Loading…</div>';
    const rows = await H.get(`/data/cal/${sel.value}.json`);
    out.innerHTML = `<p class="small muted">${H.int(rows.length)} release days in ${sel.value}</p><div class="tbl"><table><thead><tr><th>Date</th><th>Release</th><th>Agency</th><th>Evidence</th></tr></thead><tbody>${rows.slice().reverse().map(r => { const re = H.find(idx.releases, r[2]); return `<tr data-n="${H.esc((r[2] + ' ' + r[3]).toLowerCase())}"><td style="white-space:nowrap">${H.date(r[0])}${r[1] ? ' ' + H.esc(r[1]) : ''}</td><td>${re ? `<a href="${H.browseUrl('r', re.slug)}">${H.esc(r[2])}</a>` : H.esc(r[2])}${r[4] ? `<div class="small muted">${H.esc(r[4])}</div>` : ''}</td><td class="small">${H.esc(r[3])}</td><td class="small muted">${H.esc(r[5])}</td></tr>`; }).join('')}</tbody></table></div>`;
    f.oninput();
  };
  f.oninput = () => { const v = f.value.toLowerCase(); out.querySelectorAll('tbody tr').forEach(tr => { tr.style.display = tr.dataset.n.includes(v) ? '' : 'none'; }); };
  sel.onchange = () => { history.replaceState(null, '', '?y=' + sel.value); show(); };
  show();
})();
</script>
</body>
</html>
