name: hrtd update
# 1116: one job watches FRED (tools/watch.sh: a check every 30 seconds, the add-only update and the deploy at once when a
# held series is newer) for about 5 hours, then starts the next run. One run at a time (concurrency): the next waits for
# this one to end. The schedule below is only a second starter (GitHub fired it 3 times in 21 hours).
# DEPLOY_BRANCH: 'github' publishes to the preview github.hrtd.pages.dev (shadow weeks); 'main' = hrtd.pages.dev itself.
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'run even if the check finds nothing new'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: hrtd-update
  cancel-in-progress: false
env:
  DEPLOY_BRANCH: main
  WORK: /mnt/hrtd/work
  LU_FILE: /mnt/hrtd/lu/lu.json.gz
  FRESH_FILE: /mnt/hrtd/lu/fresh.json
  FRED_PER_MIN: '110'
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: libraries (the Mac's exact versions)
        run: pip install --quiet pandas==3.0.6 pyarrow==25.0.1 numpy==2.5.1
      - name: room on /mnt
        run: sudo mkdir -p /mnt/hrtd && sudo chown -R "$USER" /mnt/hrtd && df -h /mnt | tail -1
      - name: our FRED stamps from the last run
        uses: actions/cache/restore@v4
        with:
          path: /mnt/hrtd/lu
          key: hrtd-lu-${{ github.run_id }}
          restore-keys: hrtd-lu-
      - name: watch FRED and add what is new (a check every 30 seconds for about 5 hours; state kept on the runner)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORCE: ${{ inputs.force }}
        run: bash tools/watch.sh
      - name: save our FRED stamps
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/hrtd/lu
          key: hrtd-lu-${{ github.run_id }}
      - name: start the next run (GitHub's schedule is not dependable)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main
