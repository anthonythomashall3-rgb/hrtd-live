name: hrtd update
# Every 10 minutes a cheap check asks FRED whether any series we hold has a newer stamp; only then does the full add-only
# run start. One run at a time (concurrency); a run that hits its time budget saves what it did and leaves the rest pending.
# DEPLOY_BRANCH: 'github' publishes to the preview github.hrtd.pages.dev (shadow weeks); 'main' = hrtd.pages.dev itself.
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'run even if the check finds nothing new'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: hrtd-update
  cancel-in-progress: false
env:
  DEPLOY_BRANCH: github
  WORK: /mnt/hrtd/work
  LU_FILE: /mnt/hrtd/lu/lu.json.gz
  FRED_PER_MIN: '60'
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: libraries (the Mac's exact versions)
        run: pip install --quiet pandas==3.0.6 pyarrow==25.0.1 numpy==2.5.1
      - name: room on /mnt
        run: sudo mkdir -p /mnt/hrtd && sudo chown -R "$USER" /mnt/hrtd && df -h /mnt | tail -1
      - name: our FRED stamps from the last run
        uses: actions/cache/restore@v4
        with:
          path: /mnt/hrtd/lu
          key: hrtd-lu-${{ github.run_id }}
          restore-keys: hrtd-lu-
      - name: anything new on FRED?
        id: pre
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else python -m hrtd.precheck; fi
      - name: add what is new
        id: upd
        if: steps.pre.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MAX_MIN: '320'
        run: python -m hrtd.update
      - name: save our FRED stamps
        if: steps.pre.outputs.run == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/hrtd/lu
          key: hrtd-lu-${{ github.run_id }}
      - name: deploy the site
        if: steps.upd.outputs.changed == 'true' && success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D=/mnt/hrtd/deploy; rm -rf "$D"; mkdir -p "$D"
          cp -R web/. "$D/"; cp -al "$WORK/site/data" "$D/data"
          n=$(find "$D" -type f | wc -l); echo "files: $n"; [ "$n" -lt 19800 ] || { echo "over the Pages limit of 20,000 files"; exit 1; }
          npx --yes wrangler@4 pages deploy "$D" --project-name hrtd --branch "$DEPLOY_BRANCH" --commit-dirty=true
      - name: side by side with the Mac's site
        if: steps.upd.outputs.changed == 'true' && success() && env.DEPLOY_BRANCH == 'github'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m hrtd.parity; rc=$?
          python -c "from hrtd import store; store.commit('parity: side by side with the Mac')"
          exit $rc
